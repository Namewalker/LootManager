name: LootManager
version: 1.1.0
main: com.lootmanager.LootManagerPlugin
description: Comprehensive loot generation, table management, and world-region scanning plugin.
commands:
  loot:
    description: Main LootManager command entry point.
    usage: /loot <table|region|registry|fillworld|preview|stats|reload>
    aliases: [lm]
permissions:
  loot.admin:
    description: Allows access to LootManager administration commands.
    default: op
    children:
      loot.table: true
      loot.edit: true
      loot.fill: true
      loot.refill: true
      loot.region: true
      loot.wand: true
      loot.stats: true
      loot.preview: true
      loot.reload: true
  loot.table:
    description: Allows loot table management commands.
    default: op
  loot.edit:
    description: Allows GUI loot editing.
    default: op
  loot.fill:
    description: Allows world and selection scanning commands.
    default: op
  loot.refill:
    description: Allows refill related commands.
    default: op
  loot.region:
    description: Allows region management commands.
    default: op
  loot.wand:
    description: Allows selection wand usage.
    default: op
  loot.stats:
    description: Allows viewing plugin statistics.
    default: op
  loot.preview:
    description: Allows loot preview commands.
    default: op
  loot.reload:
    description: Allows config reloads.
    default: op
